name: Minbot monitoring 

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: badminton-slot-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: 코드 받기
        uses: actions/checkout@v4

      - name: Python 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 신청 상태 확인
        id: monitor
        run: python monitor.py

      - name: 텔레그램 알림 발송
        if: steps.monitor.outputs.open_found == 'true'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DETAILS: ${{ steps.monitor.outputs.details }}
          TARGET_URL: ${{ steps.monitor.outputs.target_url }}
        run: |
          TEXT=$(printf '🚨 [배드민턴 접수 가능 알림]\n\n%s\n\n🔗 신청 페이지: %s' "$DETAILS" "$TARGET_URL")
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${TEXT}"
